[project]
name = "ms2rescore"
version = "4.0.1"
description = " Modular and user-friendly platform for AI-assisted rescoring of peptide identifications."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "MS2Rescore",
    "MS2PIP",
    "DeepLC",
    "proteomics",
    "mass spectrometry",
    "peptide identification",
    "rescoring",
    "machine learning",
]
authors = [
    { name = "Ralf Gabriels", email = "ralf@gabriels.dev" },
    { name = "Arthur Declercq", email = "arthur.declercq@ugent.be" },
    { name = "Ana Sílvia C. Silva" },
    { name = "Robbe Devreese" },
    { name = "Robbin Bouwmeester" },
    { name = "Louise Buur" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">=3.11"
dependencies = [
    "cascade-config>=0.4.0",
    "click>=7",
    "customtkinter>=5,<6",
    "deeplc>=4.0.0",
    "im2deep>=2.0.1",
    "jinja2>=3",
    "lxml>=4.5",
    "ms2pip>=4.2.0",
    "ms2rescore_rs>=0.5.0",
    "numpy>=1.25,<3.0",
    "packaging>=25.0",
    "pandas>=1",
    "plotly>=5",
    "psm_utils>=1.1",
    "pyarrow>=14",
    "pyteomics>=4.7.2",
    "rich>=12",
    "ristretto-ms>=0.3.0",
]

[project.optional-dependencies]
mumble = ["mumble>=0.3.0"]
idxml = ["pyopenms>=3.3"]

[dependency-groups]
dev = ["ruff", "black", "pytest>=8.4.2", "pytest-cov", "pre-commit>=4.3.0"]
docs = [
    "sphinx",
    "myst-parser",
    "nbsphinx",
    "numpydoc>=1,<2",
    "semver>=2",
    "sphinx_inline_tabs",
    "sphinx_rtd_theme",
    "sphinx-argparse",
    "sphinx-autobuild",
]
nb = ["ipykernel", "ipywidgets", "plotly"]
installer = ["cbor2", "pyinstaller", "pyopenms==3.5"]

[project.urls]
GitHub = "https://github.com/compomics/ms2rescore"
ReadTheDocs = "https://ms2rescore.readthedocs.io"
PyPi = "https://pypi.org/project/ms2rescore/"
CompOmics = "https://www.compomics.com"

[project.scripts]
ms2rescore = "ms2rescore.__main__:main"
ms2rescore-gui = "ms2rescore.gui.__main__:main"
ms2rescore-report = "ms2rescore.report.__main__:main"
tims2rescore = "ms2rescore.__main__:main_tims"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ms2rescore"
module-root = ""

[tool.pytest.ini_options]
markers = [
    "integration: slow end-to-end tests requiring example data (deselect with '-m not integration')",
    "slow: tests that load real prediction models (deselect with '-m not slow')",
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 99
target-version = ['py311']

[tool.ruff]
line-length = 99
target-version = 'py311'

[tool.ruff.lint]
extend-select = ["T201", "T203"]
